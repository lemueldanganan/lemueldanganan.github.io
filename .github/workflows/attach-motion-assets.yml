name: Attach motion and AdSense assets

on:
  push:
    paths:
      - '.github/workflows/attach-motion-assets.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach CSS, JavaScript, and AdSense
        run: |
          grep -q 'assets/motion.css' index.html || sed -i '/<\/head>/i <link rel="stylesheet" href="assets/motion.css">' index.html
          grep -q 'ca-pub-7505640015662375' index.html || sed -i '/<\/head>/i <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7505640015662375" crossorigin="anonymous"></script>' index.html
          grep -q 'google-adsense-account' index.html || sed -i '/<\/head>/i <meta name="google-adsense-account" content="ca-pub-7505640015662375">' index.html
          grep -q 'assets/motion.js' index.html || sed -i '/<\/body>/i <script src="assets/motion.js" defer></script>' index.html
      - name: Commit changes
        run: |
          git config user.name "lemueldanganan"
          git config user.email "lemdanganan@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Attach AdSense and site assets"
            git push
          fi
