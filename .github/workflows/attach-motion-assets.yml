name: Attach motion assets

on:
  push:
    paths:
      - '.github/workflows/attach-motion-assets.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach CSS and JavaScript
        run: |
          grep -q 'assets/motion.css' index.html || sed -i '/<\/head>/i <link rel="stylesheet" href="assets/motion.css">' index.html
          grep -q 'assets/motion.js' index.html || sed -i '/<\/body>/i <script src="assets/motion.js" defer></script>' index.html
      - name: Commit changes
        run: |
          git config user.name "lemueldanganan"
          git config user.email "lemdanganan@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Attach elegant motion assets"
            git push
          fi
