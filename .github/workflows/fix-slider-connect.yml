name: Apply calligraphic signature

on:
  push:
    paths:
      - '.github/workflows/fix-slider-connect.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Style signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          old_css = '.sign{font:clamp(24px,3vw,32px) "Segoe Script","Brush Script MT",cursive;color:var(--gold2);white-space:nowrap;display:inline-block}.person{margin-top:8px;color:var(--gold2);font-size:12px}.roles{font-size:11px;color:#f5f0e4;margin-top:2px}'
          new_css = '.signature-block{text-align:center;display:flex;flex-direction:column;align-items:center}.sign{font-family:"Snell Roundhand","Monotype Corsiva","Apple Chancery","URW Chancery L","Segoe Script","Brush Script MT",cursive;font-size:clamp(58px,7vw,82px);font-style:italic;font-weight:400;line-height:.88;letter-spacing:-.055em;color:var(--gold2);white-space:nowrap;display:inline-block;transform:skewX(-5deg) scaleX(1.04);transform-origin:center;margin:0 auto 12px;text-shadow:0 1px 0 rgba(255,255,255,.08)}.person{text-align:center;margin-top:4px;color:var(--gold2);font-size:12px}.roles{text-align:center;font-size:11px;color:#f5f0e4;margin-top:2px}'
          t = t.replace(old_css, new_css)

          old_html = '<div><div class="sign">Lemuel D. Danganan</div><div class="person">DR. LEMUEL DAYRIT DANGANAN</div><div class="roles">Pastor · Scholar · Teacher · Researcher</div></div>'
          new_html = '<div class="signature-block"><div class="sign" aria-label="Lemuel">Lemuel</div><div class="person">DR. LEMUEL DAYRIT DANGANAN</div><div class="roles">Pastor · Scholar · Teacher · Researcher</div></div>'
          t = t.replace(old_html, new_html)

          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "lemueldanganan"
          git config user.email "lemdanganan@gmail.com"
          git add index.html
          git rm .github/workflows/fix-slider-connect.yml
          git commit -m "Style signature as calligraphic Lemuel"
          git push
